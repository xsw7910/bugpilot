# Publish BugPilot to PyPI through Trusted Publishing (GitHub OIDC).
#
# Manual only: Actions > Release > Run workflow, from main, with the release
# commit's full SHA and its version. Nothing here runs on a push, a tag or a
# pull request. No PyPI token exists anywhere: PyPI trusts this workflow file in
# this repository, publishing through the `pypi` environment. Setup and the
# checks to run before approving the publish job: docs/development.md.
#
# Fail closed, in order: the build job refuses any ref but main, then
# scripts/release_preflight.py refuses a commit that is not the one checked out,
# a version that is not the source's, or a commit CI has not passed — all before
# a build tool is installed. The build tools are pinned with hashes
# (.github/release-requirements.txt), the actions to full commit SHAs, and the
# publish job checks that it holds exactly the files the build job hashed.
#
# A PyPI version can never be uploaded twice, so the publish job publishes
# exactly the files the build job built and checked, and nothing else.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as in bugpilot/__init__.py (for example 0.1.0)"
        required: true
        type: string
      commit:
        description: "The release commit: main's head, its full 40-character SHA, already green in CI"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to read CI's results for the release commit (release_preflight.py):
      # its check runs, and the CI workflow runs they belong to.
      checks: read
      actions: read
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
    steps:
      # Before anything else: a dispatch from another branch or a tag stops here.
      - name: Refuse any ref but main
        shell: bash
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::releases run only from refs/heads/main, not $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The operator's inputs, read through the environment and never pasted into
      # the script: the commit must be the one checked out, the version the
      # source's, and CI green on that commit.
      - name: Check the release source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/release_preflight.py

      - name: Install the build tools (pinned, with hashes)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/release-requirements.txt

      # No isolation: the backend is the pinned setuptools installed above, not
      # whatever version an isolated environment would download.
      - name: Build the wheel and the sdist
        shell: bash
        run: |
          test ! -e dist
          python -m build --no-isolation --sdist --wheel --outdir dist .

      # The requested version, read through the environment and never pasted
      # into the script, must be the one the source builds.
      - name: Check that exactly the requested version was built
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          expected=$(printf '%s\n' "bugpilot-${VERSION}-py3-none-any.whl" "bugpilot-${VERSION}.tar.gz" | sort)
          actual=$(ls dist | sort)
          [ "$actual" = "$expected" ] || { echo "::error::built: $(echo $actual), expected version $VERSION"; exit 1; }

      - name: Check the distributions
        shell: bash
        run: python -m twine check --strict dist/*

      - name: Record what was built
        id: record
        shell: bash
        run: |
          {
            echo "### Built from \`${GITHUB_SHA}\`"
            echo "Python $(python -c 'import platform; print(platform.python_version())'), $(python -m pip --version | cut -d' ' -f1-2), build tools from .github/release-requirements.txt"
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'sha256<<SHA256_END'
            (cd dist && sha256sum *)
            echo 'SHA256_END'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # The build job already refuses other refs; this keeps the publish job off them too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bugpilot/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      # Exactly the files the build job hashed, unchanged, and nothing else.
      - name: Check that these are the files the build job built
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          printf '%s\n' "$EXPECTED" | sed '/^$/d' > "$RUNNER_TEMP/expected.sha256"
          (cd dist && sha256sum --check --strict "$RUNNER_TEMP/expected.sha256")
          # The name starts at column 67 (64 hex digits, then "  " or " *") in text or binary mode alike.
          [ "$(ls dist | sort)" = "$(cut -c67- "$RUNNER_TEMP/expected.sha256" | sort)" ] || { echo "::error::dist/ holds files the build job did not hash"; exit 1; }
          (cd dist && sha256sum *)

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
