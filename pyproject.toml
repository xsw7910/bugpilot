[build-system]
# 77 is where PEP 639 landed: `license` as an SPDX expression plus
# `license-files`. The older `license = {file = ...}` form still works but is
# deprecated, and this package is about to be published.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bugpilot"
# One version, in bugpilot/__init__.py: `bugpilot --version`, `doctor --json`, the
# MCP server and the wheel metadata all read it, so they cannot disagree.
dynamic = ["version"]
description = "Turn a Jira issue or a bug you describe into focused code context for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
# Name only, no email: a contact address on a public package is a public
# address.
authors = [{ name = "Shiwei Xing" }]
keywords = ["ai", "debugging", "bug-fixing", "jira", "code-context", "developer-tools", "claude", "codex"]
# No `License ::` classifier: with PEP 639 the SPDX expression above is the
# licence declaration, and setuptools rejects both being given.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
]
# Source-available, not open source: the Business Source License 1.1 with
# BugPilot's parameters at the top of LICENSE. Its Additional Use Grant covers
# internal production use, including commercial and client development work;
# a competing hosted, managed, embedded or redistributed offering needs a
# separate commercial license. Apache-2.0 after the Change Date.
license = "BUSL-1.1"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Optional so the CLI, the wheel and the PyInstaller exe stay dependency-free;
# only an MCP install pulls the SDK in.
mcp = ["mcp>=2"]

[project.scripts]
bugpilot = "bugpilot.cli:main"
bugpilot-mcp = "bugpilot.mcp_server:main"

# The links PyPI shows beside the description. No Changelog: the repository's
# only one, extension/CHANGELOG.md, is the VS Code extension's.
[project.urls]
Repository = "https://github.com/xsw7910/bugpilot"
Issues = "https://github.com/xsw7910/bugpilot/issues"

[tool.setuptools.packages.find]
include = ["bugpilot*"]

[tool.setuptools.dynamic]
version = { attr = "bugpilot.__version__" }
